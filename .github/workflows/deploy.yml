name: Deploy to OVH

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Inject Claude API Key into PHP proxy
        run: |
          node -e "const fs = require('fs'); const key = process.env.CLAUDE_API_KEY; if (!key) { console.error('CLAUDE_API_KEY secret is empty - the AI analysis would be broken in production.'); process.exit(1); } const file = 'public/api/claude.php'; const src = fs.readFileSync(file, 'utf8'); if (!src.includes('CLAUDE_API_KEY_PLACEHOLDER')) { console.error('Placeholder not found in ' + file); process.exit(1); } fs.writeFileSync(file, src.replace('CLAUDE_API_KEY_PLACEHOLDER', key));"
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Build the project
        run: npm run build
        env:
          VITE_CRM_WEBHOOK_URL: ${{ secrets.VITE_CRM_WEBHOOK_URL }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_EMAILJS_CLIENT_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_CLIENT_TEMPLATE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}

      - name: Deploy to OVH via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./www/
          protocol: ftp
